name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Every commit on main keeps its own result (Render waits for CI); other refs cancel older runs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  server:
    name: server (lint, format, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    env:
      # Outside node_modules, so `npm ci` doesn't delete it and actions/cache can keep it.
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json

      # The mongod binary for mongodb-memory-server (~100 MB). The lockfile pins
      # the mongodb-memory-server version, which decides the MongoDB version.
      - name: Cache MongoDB binary
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  client:
    name: client (lint, format, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # No VITE_API_BASE_URL: the build falls back to '/api'. This only checks that it builds.
      - run: npm run build
